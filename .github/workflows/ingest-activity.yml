name: Ingest GitHub Activity

on:
  schedule:
    # Runs once a day. GitHub may delay scheduled runs during high load.
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: read

concurrency:
  group: ingest-github-activity
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run ingestion
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ingest_github_activity.py

      - name: Commit updated activity data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/activity data/feed
          if git diff --cached --quiet; then
            echo "No activity changes to commit."
          else
            git commit -m "chore: refresh GitHub activity aggregates [skip ci]"
            git push
          fi
